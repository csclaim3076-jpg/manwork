name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: JDK 17 설치
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Android SDK 설치
      uses: android-actions/setup-android@v3

    - name: APK 빌드
      run: |
        cd 인부일보_GitHub업로드용
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: APK 업로드
      uses: actions/upload-artifact@v4
      with:
        name: 인부일보-APK
        path: 인부일보_GitHub업로드용/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
