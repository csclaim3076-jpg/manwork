plugins {
    id 'com.android.application'
}
android {
    namespace 'kr.co.concost.inbuildlog'
    compileSdk 34
    defaultConfig {
        applicationId "kr.co.concost.inbuildlog"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }
    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions {
        noCompress 'html','js','css','json','png','jpg'
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
